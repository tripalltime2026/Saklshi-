name: Laravel CI

on:
  push:
    branches:
      - main
      - feat/laravel-cloud-reservations
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env

      - name: Migrate and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Verify authentication and booking capacity
        run: php tests/operations.php

      - name: Smoke test
        run: |
          php artisan route:list
          php artisan view:cache
          php artisan about
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/saklshi-ci.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          if ! curl --fail --show-error http://127.0.0.1:8000/__ci/admin-dashboard > /tmp/admin.html; then
            echo "---- Laravel server log ----"
            cat /tmp/saklshi-ci.log || true
            echo "---- Laravel application log ----"
            cat storage/logs/laravel.log || true
            kill $SERVER_PID || true
            exit 1
          fi
          kill $SERVER_PID
          test -s /tmp/admin.html


      - name: Setup Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify preorder and live admin in browser
        run: |
          SESSION_SECURE_COOKIE=false ADMIN_LOGIN=test-admin ADMIN_PASSWORD=ci-only-password php artisan serve --host=127.0.0.1 --port=8000 > /tmp/saklshi-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do curl -sf http://localhost:8000/up && break || sleep 1; done
          node tests/booking-browser.mjs
